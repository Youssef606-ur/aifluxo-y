<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIFluxo - نبض الذكاء الاصطناعي</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
            --text-secondary: #94a3b8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
        }

        header {
            background-color: var(--card-bg);
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid var(--accent-color);
        }

        h1 {
            margin: 0;
            color: var(--accent-color);
            font-size: 2rem;
        }

        p.subtitle {
            color: var(--text-secondary);
            margin-top: 5px;
        }

        .container {
            max-width: 1000px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .news-card {
            background-color: var(--card-bg);
            border-radius: 10px;
            padding: 20px;
            border: 1px solid #334155;
            transition: transform 0.2s;
        }

        .news-card:hover {
            transform: translateY(-5px);
        }

        .news-title {
            font-size: 1.2rem;
            color: var(--text-color);
            margin-top: 0;
        }

        .news-desc {
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .read-more {
            display: inline-block;
            margin-top: 15px;
            color: var(--accent-color);
            text-decoration: none;
            font-weight: bold;
        }

        /* مكان محدد للإعلانات مستقبلاً */
        .ad-banner {
            background-color: #334155;
            color: var(--text-secondary);
            text-align: center;
            padding: 15px;
            margin: 20px 0;
            border-radius: 8px;
            border: 1px dashed var(--accent-color);
        }
    </style>
</head>
<body>

    <header>
        <h1>AIFluxo 🤖</h1>
        <p class="subtitle">موقعك الأول لأحدث أخبار وتطورات الذكاء الاصطناعي لحظة بلحظة</p>
    </header>

    <div class="container">
        <!-- مساحة إعلانية علوية -->
        <div class="ad-banner">مساحة إعلانية (مجهزة لـ AdSense)</div>

        <main class="news-grid" id="news-container">
            <div class="news-card">
                <h2 class="news-title">جاري تحميل أحدث الأخبار التلقائية...</h2>
                <p class="news-desc">سيتم ربط البايثون في الخطوة القادمة لسحب الأخبار أوتوماتيكياً هنا!</p>
            </div>
        </main>

        <!-- مساحة إعلانية سفلية -->
        <div class="ad-banner">مساحة إعلانية (مجهزة لـ AdSense)</div>
    </div>

</body>
</html>
