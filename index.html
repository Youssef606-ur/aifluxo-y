<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIFluxo | نبض الذكاء الاصطناعي</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151c2c;
            --border-color: #2a354c;
            --accent-color: #38bdf8;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --badge-bg: #0284c7;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
        }

        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            position: sticky; top: 0; z-index: 100;
        }

        .header-container {
            max-width: 1200px; margin: 0 auto;
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 20px;
        }

        .logo {
            font-size: 1.8rem; font-weight: bold; color: var(--accent-color);
            text-decoration: none; display: flex; align-items: center; gap: 10px;
        }

        nav ul { display: flex; list-style: none; gap: 20px; }
        nav a { color: var(--text-secondary); text-decoration: none; font-weight: 500; cursor: pointer; transition: 0.3s; }
        nav a:hover, nav a.active { color: var(--accent-color); }

        .ticker-wrap {
            background: #1e293b; border-bottom: 1px solid var(--border-color);
            display: flex; align-items: center; overflow: hidden; height: 40px;
        }

        .ticker-title {
            background: #ef4444; color: white; padding: 0 15px; height: 100%;
            display: flex; align-items: center; font-weight: bold; font-size: 0.85rem;
            white-space: nowrap; z-index: 2;
        }

        .ticker-text { color: var(--text-primary); font-size: 0.9rem; padding-right: 20px; white-space: nowrap; }

        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }

        .ad-space {
            background-color: var(--card-bg); border: 1px dashed var(--border-color);
            text-align: center; padding: 15px; margin-bottom: 30px; border-radius: 8px;
            color: var(--text-secondary); font-size: 0.85rem;
        }

        .main-layout { display: grid; grid-template-columns: 2fr 1fr; gap: 30px; }

        @media (max-width: 768px) {
            .main-layout { grid-template-columns: 1fr; }
            nav { display: none; }
        }

        .hero-card {
            background-color: var(--card-bg); border-radius: 12px;
            border: 1px solid var(--border-color); overflow: hidden; margin-bottom: 30px;
        }

        .hero-img { width: 100%; height: 320px; object-fit: cover; display: block; }
        .hero-body { padding: 25px; }

        .category-badge {
            background-color: var(--badge-bg); color: white; font-size: 0.75rem;
            padding: 4px 10px; border-radius: 20px; display: inline-block; margin-bottom: 12px; font-weight: bold;
        }

        .hero-title { font-size: 1.6rem; margin-bottom: 12px; color: var(--text-primary); line-height: 1.4; }
        .hero-title a { color: inherit; text-decoration: none; }
        .hero-title a:hover { color: var(--accent-color); }

        .meta-info { color: var(--text-secondary); font-size: 0.85rem; margin-bottom: 15px; display: flex; gap: 15px; }

        .sub-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }

        .sub-card {
            background-color: var(--card-bg); border-radius: 10px;
            border: 1px solid var(--border-color); overflow: hidden;
            display: flex; flex-direction: column; justify-content: space-between;
        }

        .sub-img { width: 100%; height: 150px; object-fit: cover; }
        .sub-content { padding: 18px; }
        .sub-card h3 { font-size: 1.05rem; margin-bottom: 10px; line-height: 1.4; }
        .sub-card h3 a { color: var(--text-primary); text-decoration: none; }
        .sub-card h3 a:hover { color: var(--accent-color); }

        .sidebar-section {
            background-color: var(--card-bg); border-radius: 12px;
            border: 1px solid var(--border-color); padding: 20px; margin-bottom: 25px;
        }

        .section-header {
            font-size: 1.2rem; border-bottom: 2px solid var(--accent-color);
            padding-bottom: 8px; margin-bottom: 15px; display: flex; align-items: center; gap: 8px;
        }

        .sidebar-list { list-style: none; }
        .sidebar-item { padding: 12px 0; border-bottom: 1px solid var(--border-color); }
        .sidebar-item:last-child { border-bottom: none; }
        .sidebar-item a { color: var(--text-primary); text-decoration: none; font-size: 0.95rem; font-weight: 500; display: block; margin-bottom: 5px; }
        .sidebar-item a:hover { color: var(--accent-color); }

        footer {
            background-color: var(--card-bg); border-top: 1px solid var(--border-color);
            text-align: center; padding: 25px; margin-top: 50px; color: var(--text-secondary); font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <a href="#" class="logo"><i class="fa-solid fa-brain"></i> AIFluxo</a>
            <nav>
                <ul>
                    <li><a onclick="filterNews('all')" class="active">الرئيسية</a></li>
                    <li><a onclick="filterNews('openai')">أخبار OpenAI</a></li>
                    <li><a onclick="filterNews('google')">جوجل والتقنية</a></li>
                    <li><a onclick="filterNews('tech')">تطبيقات وأدوات</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="ticker-wrap">
        <div class="ticker-title"><i class="fa-solid fa-bolt" style="margin-left: 5px;"></i> عاجل</div>
        <div class="ticker-text" id="ticker-content">جاري جلب أحدث العناوين...</div>
    </div>

    <div class="container">
        <div class="ad-space">مساحة إعلانية علوية (Google AdSense)</div>

        <div class="main-layout">
            <div>
                <div id="hero-container"></div>

                <h3 class="section-header"><i class="fa-solid fa-newspaper"></i> أحدث المقالات والأخبار</h3>
                <div class="sub-grid" id="sub-news-container"></div>
            </div>

            <aside>
                <div class="sidebar-section">
                    <h3 class="section-header"><i class="fa-solid fa-fire"></i> الأكثر قراءة</h3>
                    <ul class="sidebar-list" id="sidebar-news"></ul>
                </div>
                <div class="ad-space" style="height: 250px; display: flex; align-items: center; justify-content: center;">
                    مساحة إعلانية جانبية
                </div>
            </aside>
        </div>
    </div>

    <footer>
        <p>© 2026 AIFluxo - جميع الحقوق محفوظة | منصة أخبار الذكاء الاصطناعي</p>
    </footer>

    <script>
        let allArticles = [];

        async function loadNews() {
            try {
                const response = await fetch('news.json');
                allArticles = await response.json();
                
                if(!allArticles || allArticles.length === 0) return;

                document.getElementById('ticker-content').innerText = allArticles[0].title;
                displayArticles(allArticles);

            } catch (error) {
                console.log('خطأ في التحميل');
            }
        }

        function displayArticles(articles) {
            if(articles.length === 0) return;

            // Hero Article
            const hero = articles[0];
            document.getElementById('hero-container').innerHTML = `
                <div class="hero-card">
                    <img src="${hero.image}" class="hero-img" onerror="this.src='https://images.unsplash.com/photo-1677442136019-21780efad99a?w=800&q=80'">
                    <div class="hero-body">
                        <span class="category-badge">تغطية خاصة</span>
                        <h2 class="hero-title"><a href="${hero.link}" target="_blank">${hero.title}</a></h2>
                        <div class="meta-info">
                            <span><i class="fa-regular fa-clock"></i> ${hero.date}</span>
                            <span><i class="fa-solid fa-globe"></i> المصدر الرسمي</span>
                        </div>
                        <a href="${hero.link}" target="_blank" style="color: var(--accent-color); font-weight: bold; text-decoration: none;">متابعة الخبر كاملًا ←</a>
                    </div>
                </div>
            `;

            // Sub Grid
            const subContainer = document.getElementById('sub-news-container');
            subContainer.innerHTML = '';
            articles.slice(1, 5).forEach(item => {
                subContainer.innerHTML += `
                    <div class="sub-card">
                        <img src="${item.image}" class="sub-img" onerror="this.src='https://images.unsplash.com/photo-1677442136019-21780efad99a?w=800&q=80'">
                        <div class="sub-content">
                            <span class="category-badge" style="background-color: #334155;">ذكاء اصطناعي</span>
                            <h3><a href="${item.link}" target="_blank">${item.title}</a></h3>
                            <div class="meta-info" style="margin-top: 10px; margin-bottom: 0; font-size: 0.75rem;">
                                <span><i class="fa-regular fa-clock"></i> ${item.date}</span>
                            </div>
                        </div>
                    </div>
                `;
            });

            // Sidebar
            const sidebarContainer = document.getElementById('sidebar-news');
            sidebarContainer.innerHTML = '';
            articles.slice(5).forEach(item => {
                sidebarContainer.innerHTML += `
                    <li class="sidebar-item">
                        <a href="${item.link}" target="_blank">${item.title}</a>
                        <div class="meta-info" style="margin-bottom:0; font-size:0.75rem;">${item.date}</div>
                    </li>
                `;
            });
        }

        function filterNews(category) {
            // تحديث تصميم الزرار النشط
            document.querySelectorAll('nav a').forEach(el => el.classList.remove('active'));
            event.target.classList.add('active');

            if(category === 'all') {
                displayArticles(allArticles);
            } else {
                // فلترة الأخبار بناءً على الكلمة المفتاحية في العنوان
                let filtered = allArticles.filter(item => item.title.toLowerCase().includes(category));
                if(filtered.length === 0) filtered = allArticles; // لو مفيش يعرض الكل احتياطياً
                displayArticles(filtered);
            }
        }

        loadNews();
    </script>
</body>
</html>
